# fly.toml app configuration file generated for user-story-mapper on 2026-03-07T22:10:17+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'user-story-mapper'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'
  # COMMIT_SHA and BUILD_TIME are passed dynamically via deploy.sh

[env]
  AUTH_ENABLED = 'true'
  NODE_ENV = 'production'
  PORT = '3001'

[[mounts]]
  source = 'data'
  destination = '/app/backend/data'
  initial_size = '1'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
