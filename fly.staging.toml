# fly.staging.toml - Staging environment configuration
#
# Deploy with: fly deploy --config fly.staging.toml
#

app = 'user-story-mapper-staging'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  AUTH_ENABLED = 'true'
  NODE_ENV = 'production'
  PORT = '3001'

[[mounts]]
  source = 'data'
  destination = '/app/backend/data'
  initial_size = '1'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
